services:
  - type: web
    name: telos
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: APP_URL
        sync: false
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_FALLBACK_KEYS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
