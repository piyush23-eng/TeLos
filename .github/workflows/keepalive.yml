name: TeLos Cloud Keep-Alive

on:
  schedule:
    # Runs every 2 days at 06:00 UTC (prevents Supabase 7-day inactivity pause)
    - cron: "0 6 */2 * *"
  workflow_dispatch:

jobs:
  keepalive:
    name: Ping Database & App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Keep-Alive Ping
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_URL: ${{ secrets.APP_URL }}
        run: npx tsx scripts/keepalive.ts
